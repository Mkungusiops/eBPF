// Shared message types for the agent ↔ control-plane wire contract.
// See docs/plan/wire-contract.md for the full specification.
//
// TENANCY INVARIANT: no message in this package carries an authoritative
// tenant_id. Tenant identity is derived from the mTLS client certificate at
// the ingest/command edge (docs/plan/tenant-isolation-invariant.md R1). This is
// deliberate — a payload tenant field could only ever be tamper-detection
// telemetry, never an authorization input.
syntax = "proto3";

package ebpfsoc.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jeffmk/ebpf-poc-engine/gen/ebpfsoc/v1;ebpfsocv1";

// EnforcementMode mirrors the engine's boot/runtime mode. Boot mode comes only
// from -enforce today; making it explicit on the wire lets the control plane
// observe and (via the command channel) request mode changes, while the agent
// retains local authority (docs/plan/threat-model.md EN-5).
enum EnforcementMode {
  ENFORCEMENT_MODE_UNSPECIFIED = 0;
  ENFORCEMENT_MODE_DETECT_ONLY = 1; // decisions logged, enforcer bypassed
  ENFORCEMENT_MODE_DRY_RUN = 2;     // decisions recorded, actions not executed
  ENFORCEMENT_MODE_ENFORCING = 3;   // real kill/throttle
}

// AgentInfo is the agent's self-report of identity and capabilities. Carries NO
// tenant_id (see the tenancy invariant above); agent_id is authoritative only
// as derived from the client cert — the copy here is for display/telemetry.
message AgentInfo {
  string hostname = 1;
  string agent_version = 2;
  string kernel = 3;         // uname -r
  string arch = 4;           // amd64 | arm64
  bool btf_available = 5;    // CO-RE availability
  string boot_id = 6;        // /proc/sys/kernel/random/boot_id — detects restarts
}

// DataPlaneState reports both choke data planes so the fleet service can render
// real enforcement posture (architecture.md §3.5 agent registry).
message DataPlaneState {
  string process_plane = 1;  // "cilium-ebpf" | "noop"
  int32 process_links = 2;   // attached cgroup/connect links
  string device_plane = 3;   // "tc" | "noop"
  int32 device_links = 4;    // attached tc links
  EnforcementMode mode = 5;  // PROCESS plane mode
  // The two planes arm independently, so the device plane reports its own mode.
  // Without this the console showed the process mode on the Devices surface and
  // an armed device plane still read as detect-only.
  EnforcementMode device_mode = 6;
  // Tetragon TracingPolicies are a SECOND enforcement authority, independent of
  // the modes above: a Sigkill in a loaded policy fires whatever the engine's
  // mode says, with no audit row, no reversal and no kill-switch. Reporting only
  // the fields above therefore lets the console show "detect-only" while the
  // kernel is killing processes — threat-model EN-3, which cost this project a
  // host lockout and three hosts of broken package state before it was modelled.
  //
  // With this, host posture is `engine mode ∪ kernel policy mode` rather than
  // the engine's half of it. Empty is not "safe": it means the agent could not
  // read Tetragon, which is itself worth surfacing.
  repeated KernelPolicy kernel_policies = 7;
  // Forwarded Ethernet frames the device data plane has actually observed,
  // summed across the agent's attached links.
  //
  // The console's "links are attached but no forwarded frames have been seen"
  // warning is computed from links>0 && frames==0 — the detector for attaching
  // tc to a bridge MASTER instead of its slaves, where everything looks healthy
  // and containment silently does nothing. Without this field the control plane
  // had no frame count to report and hardcoded zero, so that warning fired on
  // every multi-tenant deployment regardless of topology: a red herring on the
  // first screen an operator sees, and it discredits the one panel that would
  // matter on a genuinely inline install.
  uint64 frames_seen = 8;
  // Devices the data plane has actually OBSERVED, as distinct from devices the
  // agent merely knows about (neighbour table, DHCP). The control plane
  // previously reported devices_known for both, so a fleet where the data plane
  // saw nothing looked identical to one where it saw everything.
  uint32 devices_seen = 9;
}

// KernelPolicy is one Tetragon TracingPolicy as the KERNEL currently has it —
// not as a config file describes it. The distinction matters: a policy edited on
// disk but never reloaded still runs its old version, and a policy deleted at
// runtime returns on the next restart if its file remains.
message KernelPolicy {
  string name = 1;
  // Tetragon's own classification, straight from the daemon: "monitor" (every
  // enforcing action suppressed in-kernel) or "enforce" (they execute as
  // written). Everything this repo ships declares monitor, so an `enforce` here
  // is either hand-loaded or deliberately armed — in both cases the operator
  // should see it.
  string mode = 2;
  bool enabled = 3;
  // Enforcing actions that ACTUALLY fired (Sigkill/Signal/Override). Non-zero is
  // proof of divergence, not a prediction of it: this policy has killed
  // something without the engine's involvement.
  uint64 enforce_actions = 4;
  // Enforcing actions that WOULD have fired but were suppressed by monitor mode.
  // Non-zero means the safety net is load-bearing — the policy is trying to kill
  // and only the mode is stopping it.
  uint64 suppressed_actions = 5;
}

// ProcessEvent mirrors internal/store.Event (process_exec / process_kprobe).
message ProcessEvent {
  google.protobuf.Timestamp occurred_at = 1;
  string event_type = 2;     // "process_exec" | "process_kprobe"
  uint32 pid = 3;
  uint32 parent_pid = 4;
  string exec_id = 5;        // stable Tetragon exec_id — the correlation key
  string binary = 6;
  string args = 7;
  uint32 uid = 8;
  string policy_name = 9;    // set for kprobe events
  string dest_ip = 10;       // outbound connection destination (network events)
  uint32 dest_port = 11;
  string proto = 12;         // tcp | udp
  string remote_ip = 13;     // source/remote peer (IOC)
}

// Alert mirrors internal/store.Alert (a scored suspicious chain).
message Alert {
  google.protobuf.Timestamp occurred_at = 1;
  string severity = 2;
  string title = 3;
  string description = 4;
  string exec_id = 5;
  int32 score = 6;           // chain score at the time of alert
  string mitre_id = 7;       // MITRE ATT&CK technique id (e.g. T1059)
  string tactic = 8;         // MITRE tactic (e.g. execution)
}

// Decision mirrors internal/store.Decision — an entry of the hash-chained
// enforcement audit (internal/store/decisions.go). Every field that feeds the
// chain hash is carried VERBATIM so the central mirror re-verifies the
// tamper-evident chain per tenant without trusting the server or transport
// ordering (docs/plan/tenant-isolation-invariant.md Layer 3). The audit chain
// itself is never modified by this contract.
//
// The chain hash is sha256(prev_hash || 0x00 || canonical), where `canonical`
// (decisions.go) is built from: id, occurred_at, action, from_state→to_state,
// exec_id, pid, score, dry_run. Those fields are therefore load-bearing for
// re-verification; prev_hash/hash are hex strings exactly as stored.
message Decision {
  int64 id = 1;                 // per-agent chain position (store autoincrement)
  google.protobuf.Timestamp occurred_at = 2; // ts
  string action = 3;            // throttle | tarpit | quarantine | sever | thaw | ...
  string from_state = 4;        // chain-hashed
  string to_state = 5;          // chain-hashed
  string exec_id = 6;
  uint32 pid = 7;
  string binary = 8;
  int32 score = 9;
  string reason = 10;
  bool dry_run = 11;            // chain-hashed
  string backend = 12;
  string outcome = 13;          // "ok" or error message

  // Origin attribution (SSH/remote client that triggered the process). Optional.
  string origin_kind = 20;
  string origin_ip = 21;
  uint32 origin_port = 22;
  string origin_user = 23;
  string origin_fingerprint = 24;

  // Device attribution (network-choke decisions). Optional; exec_id carries
  // "device:<mac>" for these rows.
  string device_mac = 30;
  string device_id = 31;

  // Chain link, hex-encoded exactly as stored, carried verbatim.
  string prev_hash = 40;
  string hash = 41;
}
