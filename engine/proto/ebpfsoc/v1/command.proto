// CommandService — control-plane → agent actions. The agent dials out and holds
// the stream (works through customer NAT with no inbound access); the CP pushes
// SIGNED commands down it. Every command is verified, acked, and audited on both
// ends, and local guardrails override any command. See docs/plan/wire-contract.md §5.
syntax = "proto3";

package ebpfsoc.v1;

import "ebpfsoc/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jeffmk/ebpf-poc-engine/gen/ebpfsoc/v1;ebpfsocv1";

service CommandService {
  // The agent opens the stream and sends CommandAcks; the server streams
  // Commands. Agent-initiated so no inbound connectivity to the host is needed.
  rpc Commands(stream CommandAck) returns (stream Command);
}

message Command {
  string command_id = 1;
  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Fleet-service signature over the command's canonical bytes, and the key id
  // that produced it. The agent verifies before acting (threat-model CH-5, SC-4).
  bytes signature = 4;
  string signer_key_id = 5;
  // The operator who ordered this, empty for anything the platform did on its
  // own. Carried so the agent's audit row can say WHO, which it could not:
  // every fleet-dispatched configuration change arrived anonymous.
  //
  // IN THE SIGNATURE (see Canonical). An attributable action whose attribution
  // anyone on the path can rewrite is worse than an anonymous one — it names a
  // specific person for something they may not have done, and the audit chain
  // would carry that name as verified fact.
  string actor = 6;

  oneof action {
    SetMode set_mode = 10;
    Jail jail = 11;
    Thaw thaw = 12;
    SetThresholds set_thresholds = 13;
    ApplyPreset apply_preset = 14;
    KillSwitch kill_switch = 15;
    UpdateProtectedList update_protected_list = 16;
    ApplyPolicy apply_policy = 17;
    UpdateSuppressions update_suppressions = 18;
    ResendDecisions resend_decisions = 19;
  }
}

// Plane selects which enforcement plane a command acts on. The agent runs two
// independent gateways — processes (cgroup/BPF, a sever is a SIGKILL) and LAN
// devices (tc, a sever is a reversible drop rule) — and they arm separately.
// UNSPECIFIED means the process plane so that an older control plane, which had
// no plane field, keeps its existing meaning.
enum Plane {
  PLANE_UNSPECIFIED = 0;
  PLANE_PROCESS = 1;
  PLANE_DEVICE = 2;
}

message SetMode {
  EnforcementMode mode = 1;
  Plane plane = 2;
}

// Jail moves a target to a choke tier immediately (operator-driven override).
message Jail {
  string exec_id = 1;
  uint32 pid = 2;
  string tier = 3; // throttle | tarpit | quarantine | sever
  // Optional auto-revert: release the target back to its previous tier after
  // this many seconds. Zero means the containment stands until an operator
  // thaws it.
  //
  // The engine-local API has accepted revert_after_seconds since the revert
  // timer shipped; the fleet path had no field for it, so a multi-tenant
  // operator could not arm one at all. That left the fleet console displaying
  // a revert_pending indicator for a state it had no way to create — an
  // asymmetry that pushed operators toward permanent containment because the
  // reversible option was only reachable by SSH-ing to the host.
  uint32 revert_after_seconds = 4;
}

message Thaw {
  string exec_id = 1;
  uint32 pid = 2;
}

message SetThresholds {
  int32 throttle_at = 1;
  int32 tarpit_at = 2;
  int32 quarantine_at = 3;
  int32 sever_at = 4;
}

message ApplyPreset {
  string preset = 1; // named threshold/mode bundle
}

// KillSwitch is the fleet-wide emergency halt of enforcement (threat-model EN-2).
message KillSwitch {
  bool halt_all_enforcement = 1;
  string reason = 2;
  Plane plane = 3;
}

// UpdateProtectedList adjusts the local allow-lists the agent refuses to enforce
// against. NOTE: the agent applies conservative local minimums regardless — a
// command can never remove sudo/sshd/systemd protection and cause self-lockout
// (threat-model EN-1/EN-4; the sudo-lockout trap).
message UpdateProtectedList {
  repeated string protected_binaries = 1;
  repeated string protected_macs = 2;
}

// ApplyPolicy changes the host's DETECTION policy — the Tetragon TracingPolicy
// set the kernel is watching with.
//
// It rides the command channel rather than the policy-bundle channel because
// the command channel is the one that exists: signed, acked, audited, and
// dialled OUT by the agent so it works through customer NAT. The agent already
// holds tetragon.FineGuidanceSensorsClient — the same client it calls
// ListTracingPolicies on every heartbeat — and that interface already exposes
// AddTracingPolicy, DeleteTracingPolicy and ConfigureTracingPolicy, all three
// already linked into the shipped binary. The apply path is a method call on an
// open connection, not a new privilege boundary.
//
// SCOPE, deliberately narrow: DETECTION policy only. The ChokePolicy DSL is not
// distributable this way and is excluded, because nothing in the enforcement
// path reads its token buckets — shipping a response policy that cannot take
// effect would be a fiction with a signature on it.
message ApplyPolicy {
  repeated PolicyDoc policies = 1;
  // Names to DELETE from the kernel, applied after the adds so one command can
  // replace a policy set atomically from the operator's point of view.
  repeated string remove = 2;
  // Why. Recorded in the ack — a detection change on a production estate needs
  // an operator's reason as much as a containment does.
  string reason = 3;
}

message PolicyDoc {
  // metadata.name as Tetragon knows it. Authoritative for delete and reconcile.
  string name = 1;
  // The TracingPolicy YAML verbatim; AddTracingPolicyRequest takes exactly
  // this. Typically 1-10 KB.
  string yaml = 2;
  // "monitor" or "enforce". Empty leaves whatever the YAML declares.
  //
  // Carried separately because it decides whether a policy can KILL: an
  // enforcing TracingPolicy acts independently of the choke ladder, with no
  // audit row and no kill-switch (threat-model EN-3). Changing it must be
  // explicit, and the signature must cover it.
  string mode = 3;
}

message CommandAck {
  string command_id = 1;
  Status status = 2;
  string detail = 3;
  google.protobuf.Timestamp applied_at = 4;

  // How this agent identified the target of a Jail/Thaw. A targeted command
  // may be dispatched to several agents when the control plane cannot yet tell
  // which one is running the target, so the ack has to carry the STRENGTH of
  // the match, not just the outcome. Without it an agent that merely happens to
  // have a live process of the same PID number is indistinguishable from the
  // one actually running the target — and PID numbers collide across hosts.
  TargetMatch target_match = 5;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACCEPTED = 1; // valid signature, queued
    STATUS_APPLIED = 2;  // effected on the host
    STATUS_REJECTED = 3; // bad signature or failed local guardrail
    STATUS_EXPIRED = 4;  // past expires_at
    // The command was valid and authorized, but this agent is not running the
    // target, so it did nothing. Deliberately NOT applied and NOT rejected:
    // reporting a no-op as applied tells the operator a threat is contained
    // when it is still running, and reporting it as rejected hides the agent
    // that genuinely did enforce behind a fleet-wide "failed".
    STATUS_NOT_TARGET = 5;
  }

  enum TargetMatch {
    TARGET_MATCH_UNSPECIFIED = 0; // not a targeted command (mode, thresholds, …)
    TARGET_MATCH_NONE = 1;        // neither the exec_id nor the pid is this host's
    // Only the pid is live here, and this agent has never observed the exec_id.
    // WEAK: on a fleet, an unrelated process can hold that PID number.
    TARGET_MATCH_PID = 2;
    // This agent observed the exec_id in its OWN telemetry. Tetragon exec_ids
    // encode the node, so this is a definitive statement of ownership.
    TARGET_MATCH_EXEC_ID = 3;
    TARGET_MATCH_DEVICE = 4; // the MAC is in this agent's device table
  }
}

// UpdateSuppressions distributes the operator's SCORING suppressions to a
// tenant's agents.
//
// A suppression says "this behaviour is expected on OUR estate": a backup agent
// that reads credential paths, a config tool that calls setuid on a schedule.
// Without a way to say so a customer either lives with the false positives or
// disarms the platform, and they disarm it.
//
// # Why this is safe to distribute over the command channel
//
// A suppression can only ever REDUCE a score. It cannot raise one, create a
// rung, or widen what the platform acts on. That asymmetry is the whole reason
// this is distributable while scoring WEIGHTS are not: the worst a malicious or
// mistaken suppression achieves is a missed detection — bounded, and visible as
// a coverage gap. A weight could push every process past the sever threshold.
//
// # Replace, not merge
//
// The full set is sent every time and the agent replaces its own. A merge
// semantics would make removal impossible to express and would let two control
// planes silently accumulate rules. The list is small (an operator writes a
// handful), so the cost is nil and the desired state is unambiguous.
message UpdateSuppressions {
  repeated Suppression suppressions = 1;
  // Why. Recorded in the ack: narrowing what a fleet detects is exactly the
  // change an incident review asks about.
  string reason = 2;
}

message Suppression {
  // Absolute path, matched EXACTLY. No globs: a wildcard here is how one typo
  // silences half an estate, and the blast radius of a mistake has to stay
  // small enough to notice.
  string binary = 1;
  // Optional narrowing. Empty means "under any detection".
  string policy = 2;
  // Optional narrowing by parent binary. Empty means "any parent".
  string parent = 3;
  // The operator's justification, carried so the agent can record WHY a score
  // was withheld rather than dropping it silently.
  string reason = 4;
}

// ResendDecisions asks an agent to re-queue decisions it has already sent, so
// the control plane can close a gap in the audit chain.
//
// Central chain verification reports which agent is missing records and how
// many; the agent still holds them in its local store. Without this the
// control plane can only ever say "incomplete" — it knows what it is missing
// and has no way to ask for it.
//
// Replay is safe by construction: the control plane dedups on
// (tenant, agent, dedup_key), so a record it already holds is ignored rather
// than duplicated. That makes an over-broad request harmless and a repeated
// one idempotent.
message ResendDecisions {
  // Re-send decisions with a local id at or above this. 0 means "everything
  // you still have", which is what an operator picks when the gap is older
  // than the agent can pinpoint.
  int64 from_id = 1;
  // Upper bound on records to re-queue, so one request cannot flood an
  // agent's outbound buffer and evict the live telemetry behind it.
  uint32 limit = 2;
}
