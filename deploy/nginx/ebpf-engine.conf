# nginx reverse proxy for the eBPF Choke Gateway.
#
# Terminates TLS on :443 and forwards to the engine on :8080. The engine
# itself stays HTTP-only — TLS termination is nginx's job.
#
# /api/stream is the SSE endpoint; it needs HTTP/1.1, no buffering, and
# a long read timeout so the connection survives idle gaps between
# events.
#
# Drop fullchain.pem + privkey.pem into /etc/nginx/ebpf/ before reload.
# `make tls-vm` seeds a self-signed pair if none exists.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect plain HTTP to HTTPS. Only exception: ACME challenge for
    # Let's Encrypt renewals if the operator wires that in.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ebpf/fullchain.pem;
    ssl_certificate_key /etc/nginx/ebpf/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 10MB upload cap is plenty for the dashboard's manual override
    # endpoints; raise if you start posting large policy YAMLs.
    client_max_body_size 10m;

    # SSE stream needs special handling — disable buffering at every
    # layer (nginx proxy buffer, gzip compression, HTTP/2 chunking),
    # allow long reads, downgrade-proof to HTTP/1.1 for the upstream.
    # The engine also emits `X-Accel-Buffering: no` so even if global
    # nginx config re-enables something, this response opts out.
    location /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
        gzip off;
    }

    # Everything else: stock reverse-proxy with X-Forwarded-* so the
    # auth cookie domain logic in api/auth.go sees the real client IP.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
