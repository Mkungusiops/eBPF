# Detects a non-allowlisted process reading a credential file.
#
# DETECT-ONLY, deliberately. This policy reports (`action: Post`); it does not
# kill. The full reasoning is at the action itself near the end of this file —
# read it before changing the action, because every alternative below has been
# tried on real hosts and each one failed in a different way:
#
#   Override (EACCES)  needs CONFIG_BPF_KPROBE_OVERRIDE=y *and*
#                      security_file_permission in
#                      /sys/kernel/debug/error_injection/list. Stock Ubuntu
#                      cloud images give the first, not the second; OrbStack's
#                      kernel gives neither. Loaded nowhere we deploy.
#
#   Sigkill            Loads everywhere — and that is the problem. It cannot
#                      exempt interpreted scripts (matchBinaries matches the
#                      executable), so it killed debconf mid-configure on three
#                      hosts and blocked apt fleet-wide. It also locked the
#                      operator out of a host by killing the OpenSSH login path
#                      before the allowlist covered sshd-session.
#
#   followChildren     The obvious repair — exempt descendants of dpkg/apt
#                      rather than naming interpreters. MEASURED ON v1.6.1 AND
#                      IT DOES NOT WORK: with NotIn a descendant of a listed
#                      binary was still killed; with In a descendant was not
#                      matched. It loads reporting "added" with no warning, so
#                      it is a silent no-op that reads as a working control.
#                      Structurally wrong here regardless: the allowlist below
#                      contains systemd (PID 1 — everything is its descendant,
#                      so nothing would match) and sshd (which would exempt
#                      every interactive session).
#
# Enforcement for this signal lives in the engine's choke gateway, which matches
# the process it actually scored, honours DefaultSystemCriticalBinaries, is
# reversible, and leaves an audit row. Keep the NotIn allowlist current anyway
# (sshd/sudo/su/cron/systemd plus the shadow management tools below): it governs
# what gets reported, and a noisy detector is the one operators learn to ignore.
#
# The complete deny-list lives in match.values; extend as your fleet
# matures. Keep the allowlist narrow.
#
# Note: do NOT add a bare "/home/" prefix — security_file_permission fires
# for every read under that path, so a blanket /home/ entry would kill
# bash sourcing .bashrc, systemd execing the engine binary in
# /home/ubuntu/ebpf-poc/, and `make deploy` itself. Pin to specific
# credential subpaths (~/.ssh/, ~/.aws/, ~/.gnupg/, etc.) instead.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "override-credential-read"
spec:
  # Tetragon's own enforcement switch — and the backstop that makes the action
  # choice above a preference rather than a lockout risk.
  #
  # `monitor` makes Tetragon suppress every ENFORCING action (Sigkill, Override,
  # Signal) in the kernel, whatever the selectors below say, while leaving
  # `Post` untouched. Measured on v1.6.1, both halves:
  #   a Sigkill policy WITH this option    -> read returned, exit 0
  #   the same policy WITHOUT it           -> SIGKILLed, exit 137
  #   Post delivery with vs. without       -> identical (npost=2 both ways)
  # So detection is unaffected and enforcement cannot fire by accident.
  #
  # Declarative on purpose: this survives a Tetragon restart, whereas
  # `tetra tracingpolicy set-mode` is imperative and silently reverts — the same
  # trap as deleting a policy while leaving its file on disk.
  #
  # It also makes host posture MACHINE-READABLE. Tetragon reports this in
  # `tracingpolicy list` (MODE) and over gRPC, so the agent can tell the console
  # what the kernel is really doing instead of the console reporting only the
  # engine's half of it. Anything loaded in `enforce` mode is therefore either
  # hand-loaded or deliberately armed, and shows up as a divergence.
  # See docs/plan/threat-model.md EN-3.
  options:
    - name: "policy-mode"
      value: "monitor"
  kprobes:
    - call: "security_file_permission"
      syscall: false
      return: true
      args:
        - index: 0
          type: "file"
        - index: 1
          type: "int"
      returnArg:
        index: 0
        type: "int"
      selectors:
        - matchBinaries:
            - operator: "NotIn"
              values:
                # ── The login path. EVERY binary that authenticates a human
                # has to be listed here, or this policy is a remote-lockout: it
                # SIGKILLs whatever process reads ~/.ssh/authorized_keys or
                # /etc/shadow, which is precisely what logging in does. There is
                # then no way back over the network — recovery needs out-of-band
                # console/SSM access.
                #
                # OpenSSH >= 9.8 (Ubuntu 24.10+, Debian 13, RHEL 10) SPLIT the
                # daemon: /usr/sbin/sshd is only the listener, each connection is
                # handled by a re-exec'd sshd-session, and auth is split again
                # into sshd-auth. Allowlisting bare "sshd" was correct pre-9.8
                # and silently became a lockout on every modern distro — verified
                # on Ubuntu 26.04 / OpenSSH 10.2p1, where pubkey auth died the
                # instant the key was offered.
                - "/usr/sbin/sshd"
                - "/usr/lib/openssh/sshd-session"
                - "/usr/lib/openssh/sshd-auth"
                # Console / serial-console login — the out-of-band recovery path.
                # If this is killed too, a mistake here is unrecoverable without
                # detaching the root volume.
                - "/usr/bin/login"
                - "/bin/login"
                # EC2 Instance Connect resolves authorized_keys via this helper.
                - "/usr/share/ec2-instance-connect/eic_run_authorized_keys"
                - "/usr/lib/systemd/systemd-executor"
                - "/usr/bin/newgrp"
                - "/usr/bin/sudo"
                - "/usr/bin/su"
                - "/usr/sbin/cron"
                - "/usr/lib/systemd/systemd"
                # Shadow-management tools — legitimately read /etc/shadow.
                - "/usr/bin/passwd"
                - "/usr/bin/chage"
                - "/usr/sbin/unix_chkpwd"
                - "/usr/sbin/pam_unix_update"
                # Package-management machinery — apt/dpkg maintainer scripts
                # legitimately read /etc/shadow + /etc/gshadow during configure
                # (debconf does a getpw/getsp lookup; user/group creation reads
                # the shadow files). Without these, any upgrade whose postinst
                # touches users is SIGKILL'd mid-configure, leaving the package
                # half-configured (iF) and blocking ALL future apt operations.
                # Verified on the SOC host: /usr/share/debconf/frontend reading
                # /etc/shadow killed docker.io + libpam-systemd postinsts.
                - "/usr/bin/dpkg"
                - "/usr/sbin/dpkg-reconfigure"
                - "/usr/share/debconf/frontend"
                - "/usr/sbin/useradd"
                - "/usr/sbin/usermod"
                - "/usr/sbin/groupadd"
                - "/usr/sbin/gpasswd"
                - "/usr/sbin/chpasswd"
          matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/shadow"
                - "/etc/gshadow"
                - "/root/.ssh/"
                - "/home/ubuntu/.ssh/"
                - "/home/ubuntu/.aws/"
                - "/home/ubuntu/.kube/"
                - "/home/ubuntu/.gnupg/"
                - "/home/ubuntu/.netrc"
            - index: 1
              operator: "Mask"
              values:
                - "4"   # MAY_READ
          matchActions:
            # DETECT, not Sigkill. This policy cannot safely kill, and the reason
            # is structural rather than a missing allowlist entry:
            #
            #   matchBinaries matches the EXECUTABLE. For a `#!/usr/bin/perl`
            #   script the executable is /usr/bin/perl, so listing the script's
            #   own path in the NotIn allowlist has no effect whatsoever.
            #
            # Verified on Ubuntu 26.04 with the policy live:
            #   /usr/sbin/unix_chkpwd     (allowlisted, ELF)    -> survived
            #   /usr/share/debconf/frontend (allowlisted, perl) -> SIGKILLed
            #   /usr/bin/perl             (not allowlisted)     -> SIGKILLed
            #   /bin/cat                  (not allowlisted)     -> SIGKILLed
            #
            # debconf/frontend and dpkg-reconfigure are both scripts, so package
            # maintainer scripts were being killed mid-configure despite being
            # "allowlisted", leaving packages in iF/iU and blocking ALL further
            # apt operations. Observed on three hosts, driven by unattended-
            # upgrades on a timer — so it degrades a fleet silently over days,
            # and libpam-runtime was among the casualties.
            #
            # Making it correct would mean allowlisting /usr/bin/perl and
            # /bin/sh, which is most attacker tooling — i.e. the deny-list would
            # protect nothing. So detection stays here, and ENFORCEMENT for this
            # signal belongs to the engine's choke gateway, which matches on the
            # process it actually scored, honours DefaultSystemCriticalBinaries,
            # and gives the operator a reversible ladder plus an audit row.
            - action: Post
