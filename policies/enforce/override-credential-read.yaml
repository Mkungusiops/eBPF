# Hot policy: when a non-allowlisted process reads a credential file,
# kill it before the read can return data.
#
# Action choice — Sigkill, not Override:
#   The original draft used `action: Override` with argError -13 (EACCES)
#   so legit-but-curious tools would just see a permission error. That
#   only works when (a) the kernel is built with CONFIG_BPF_KPROBE_OVERRIDE=y
#   *and* (b) `security_file_permission` is in
#   /sys/kernel/debug/error_injection/list (i.e. carries
#   ALLOW_ERROR_INJECTION). Stock Ubuntu cloud images satisfy (a) but
#   not (b); OrbStack's custom kernel satisfies neither. So Override
#   loaded nowhere we actually deploy. Sigkill is supported on every
#   kernel ≥5.10 with kprobes enabled.
#
#   Trade-off: legit binaries that probe these paths will be killed
#   instead of EACCES'd. Mitigation: keep the NotIn allowlist current
#   (sshd/sudo/su/cron/systemd plus the shadow management tools below).
#
# The complete deny-list lives in match.values; extend as your fleet
# matures. Keep the allowlist narrow.
#
# Note: do NOT add a bare "/home/" prefix — security_file_permission fires
# for every read under that path, so a blanket /home/ entry would kill
# bash sourcing .bashrc, systemd execing the engine binary in
# /home/ubuntu/ebpf-poc/, and `make deploy` itself. Pin to specific
# credential subpaths (~/.ssh/, ~/.aws/, ~/.gnupg/, etc.) instead.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "override-credential-read"
spec:
  kprobes:
    - call: "security_file_permission"
      syscall: false
      return: true
      args:
        - index: 0
          type: "file"
        - index: 1
          type: "int"
      returnArg:
        index: 0
        type: "int"
      selectors:
        - matchBinaries:
            - operator: "NotIn"
              values:
                - "/usr/sbin/sshd"
                - "/usr/bin/sudo"
                - "/usr/bin/su"
                - "/usr/sbin/cron"
                - "/usr/lib/systemd/systemd"
                # Shadow-management tools — legitimately read /etc/shadow.
                - "/usr/bin/passwd"
                - "/usr/bin/chage"
                - "/usr/sbin/unix_chkpwd"
                - "/usr/sbin/pam_unix_update"
                # Package-management machinery — apt/dpkg maintainer scripts
                # legitimately read /etc/shadow + /etc/gshadow during configure
                # (debconf does a getpw/getsp lookup; user/group creation reads
                # the shadow files). Without these, any upgrade whose postinst
                # touches users is SIGKILL'd mid-configure, leaving the package
                # half-configured (iF) and blocking ALL future apt operations.
                # Verified on the SOC host: /usr/share/debconf/frontend reading
                # /etc/shadow killed docker.io + libpam-systemd postinsts.
                - "/usr/bin/dpkg"
                - "/usr/sbin/dpkg-reconfigure"
                - "/usr/share/debconf/frontend"
                - "/usr/sbin/useradd"
                - "/usr/sbin/usermod"
                - "/usr/sbin/groupadd"
                - "/usr/sbin/gpasswd"
                - "/usr/sbin/chpasswd"
          matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/shadow"
                - "/etc/gshadow"
                - "/root/.ssh/"
                - "/home/ubuntu/.ssh/"
                - "/home/ubuntu/.aws/"
                - "/home/ubuntu/.kube/"
                - "/home/ubuntu/.gnupg/"
                - "/home/ubuntu/.netrc"
            - index: 1
              operator: "Mask"
              values:
                - "4"   # MAY_READ
          matchActions:
            - action: Sigkill
