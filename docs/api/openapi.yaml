    labelled description per surface, and a labelled schema branch
    wherever the two answer differently: they are different handlers,
    and only one of them is the server you are calling.

    A third surface, the agent-to-control-plane wire contract, is gRPC and
    is specified by the protobuf IDL in engine/proto/ebpfsoc/v1 — not here.

    An authorisation denial on a tenant-scoped resource returns 404,
    never 403, so a caller cannot use error codes to discover which
    tenants or resources exist. Treat a 404 as 'no such thing, or not
    yours' — the distinction is deliberately unavailable. Where a 403 is
    listed it is a different refusal (no scope held at all, a failed CSRF
    check, a path outside the served tree) and never separates one
    tenant's resources from another's.

