        EventSource connects to. The control plane has no in-process event
        pipeline (agents feed it over gRPC), so this bridges the store: it emits
        new event / alert / decision rows as StreamFrames and keeps the connection
        warm with heartbeats. The high-water mark starts at connect time, so it
        never replays the REST snapshot the client already loaded.

