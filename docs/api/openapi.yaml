      summary: "handleFleetProbe"
      description: |
        control-plane — handleFleetProbe:
        handleFleetProbe reports whether ad-hoc peer consoles answer HTTP. The
        tenant's own agents never need this — they are known from heartbeats, and
        dial the CP rather than listening — so this exists for peers the operator
        adds by hand, such as a single-tenant engine console alongside the CP.
        Read authorization is required, but the probe is not tenant-scoped data:
        it carries no credentials and returns only reachability plus a status
        code.

        engine — handleFleetProbe:
        handleFleetProbe answers "are these peers up?" on behalf of the browser.
        Deliberately NOT behind requireFleet: the hosts file is the fan-out
        control set, whereas this serves the console's ad-hoc peer directory,
        which is useful precisely on engines that have no hosts file configured.
        It performs no fan-out and carries no credentials, so it grants nothing
        the operator's session did not already imply.

