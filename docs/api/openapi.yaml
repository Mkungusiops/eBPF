  "/api/version":
    get:
      tags: ["Operations"]
      operationId: get_api_version
      summary: "handleVersion"
      description: |
        control-plane — handleVersion:
        handleVersion returns the control-plane build (public; not sensitive).
        `sha` was the constant "0.3.0-controlplane" and had never changed, so the
        endpoint could not answer the one question it exists for: which code is
        this box running? It now reports the source revision the binary was built
        from. handleVersion reports the running build. It was completely ungated,
        which on an internet-facing multi-tenant console meant anyone could read
        the exact revision, dirty flag and build time of an enterprise security
        control plane — a free answer to "is this box behind on patches?", and it
        was live, returning dirty=true against a public hostname. The console
        needs it too (the sha drives the build-change reload toast), so it stays
        available to an authenticated session. Everyone else has to be on the box:
        see internal/edge for why a loopback peer alone is not sufficient evidence
        of that.

        engine — handleVersion:
        handleVersion returns the build identity + start time. The dashboard polls
        this every 30s; if `sha` changes between polls, a "new version deployed —
        reload" toast is shown so users get fresh UI without a blind hard refresh.
        `sha` stays the EMBEDDED-ASSET hash on purpose: it is the reload signal,
        and it must move whenever the shipped UI moves — including for a rebuild
        from an uncommitted tree, which is how this project actually deploys. The
        source revision is reported alongside it, because the asset hash cannot
        answer "which code is this box running?" — a Go-only fix leaves it
        unchanged.

        Surface: control-plane, engine.
        Requires the tenant query parameter on the control plane; the
        engine surface has no tenancy model and ignores it.
      parameters:
        - $ref: '#/components/parameters/tenant'
      responses:
        "200":
          description: |
            Success. The fields below are those OBSERVED on this handler's
            response path, derived from its writeJSON literals - they are
            NOT an exhaustive schema, and the shape varies by outcome.
            Read `ok` as 'the agent confirmed it applied', not 'accepted'.
            A field published WITHOUT a type is one the source does not
            settle - it is listed because the handler emits it, and left
            untyped rather than guessed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  "build":
                    type: string
                  "built_at": {}
                  "dirty": {}
                  "lab_mode":
                    description: "Whether this deployment exposes the lab surfaces. The console reads it to decide whether to offer them at all — a nav entry whose endpoint 404s is worse than no nav entry."
                  "released": {}
                  "revision": {}
                  "server_now": {}
                  "sha":
                    description: "`sha` stays the EMBEDDED-ASSET hash on purpose: it is the reload signal, and it must move whenever the shipped UI moves — including for a rebuild from an uncommitted tree, which is how this project actually deploys. The source revision is reported alongside it, because the asset hash cannot answer \"which code is this box running?\" — a Go-only fix leaves it unchanged."
                  "started_at": {}
                  "version":
                    description: "The release name. A revision answers \"which commit\"; a customer asks \"which version\", and only a tag answers that. Empty on a non-release build, which is the honest answer rather than a fabricated number."
        "401": { description: "Unauthenticated" }
        "404": { description: "Not found, or not visible to this caller" }
  "/api/whoami":
    get:
      tags: ["Authentication"]
      operationId: get_api_whoami
      summary: "handleWhoami / HandleWhoami"
      description: |
        control-plane — handleWhoami:
        Described by whoamiFor(), which builds this response: whoamiFor builds the
        identity document for one principal. Split out of the handler so the
        published contract can be tested against a hand-built principal of every
        persona — the identity path (OIDC session) is not constructible from a
        test.

        engine — HandleWhoami:
        HandleWhoami exposes the current session's username for the dashboard
        header. Returns 401 if not logged in.

        Surface: control-plane, engine.
        Requires the tenant query parameter on the control plane; the
        engine surface has no tenancy model and ignores it.
      parameters:
        - $ref: '#/components/parameters/tenant'
      responses:
        "200":
          description: |
            Success. The fields below are those OBSERVED on this handler's
            response path, derived from its writeJSON literals - they are
            NOT an exhaustive schema, and the shape varies by outcome.
            Read `ok` as 'the agent confirmed it applied', not 'accepted'.
            A field published WITHOUT a type is one the source does not
            settle - it is listed because the handler emits it, and left
            untyped rather than guessed.
          content:
            application/json:
              schema:
                anyOf:
                  - title: "control-plane — handleWhoami"
                    type: object
                    properties:
                      "can_push_policy":
                        description: "can_push_policy is a DEPLOYMENT capability, not only a permission. The console's Detections surface is one component serving two planes that change policy by different means: this one signs a command and dispatches it to its agents; the single-tenant engine applies directly to the Tetragon on its own host. Both report the capability here, so the console gates the authoring surface on what the server says it can do rather than on which plane it guesses it is talking to — a deployment with neither (a -fake engine with no Tetragon) answers false and correctly gets no button. Absent means no, which is what makes it safe for an older build that does not send the field. SCOPE is a separate question, answered by whether \"tenants\" is present: a push here reaches a fleet and cannot promise convergence, while the engine reaches one host and can."
                      "can_respond": {}
                      "cross_tenant": {}
                      "host":
                        description: "`host` is the estate identity the console renders in the top bar, in exported report headers and as the assistant's scope label. This handler used to publish scope[0] there for everyone. Combined with a TenantScope built out of capability-less default realm roles (see authz.TenantScope), that named ONE customer as the whole estate on the screen of the operator least able to notice it — the provider's own."
                      "policy_scope":
                        type: string
                        description: "SCOPE, stated rather than inferred. The console needs to know whether a policy change reaches a fleet (dispatched, acked, not converged) or one host (applied). It was deriving that from the shape of \"tenants\" — which is wrong for exactly the user most likely to push a policy: a cross-tenant MSOC admin's tenant list says which customers they may reach, not how far a push travels, and the control plane's own console would have said \"this host\". A deployment that knows the answer should say it. The engine sends no such field and the console defaults to \"host\", the narrower claim."
                      "role":
                        type: string
                        description: "The role the principal actually HOLDS — see authz.PrimaryRole for the two-valued guess this replaced, and why publishing the wrong name is not cosmetic. Empty when no recognised role is held: the console shows no role rather than an invented one."
                      "subject": {}
                      "tenants":
                        description: "`tenants` is REACH THAT NEEDS NO NAMING: the tenants this principal holds a tenant-bound grant for. A cross-tenant principal is normally not in it at all (authz.TenantScope excludes cross-tenant roles by design — they must name a tenant explicitly and be audited), and this route must never widen it into the provider's customer roster: the MSSP's customer list is itself confidential, and enumerating it here would make /api/whoami the one read that hands it over without an Authorize call or an audit record."
                      "user":
                        description: "Aliases the reused SOC frontend reads (normalizeWhoami): user + host."
                      "viewing_tenant":
                        description: "`viewing_tenant` is the third fact and the one that was missing: the tenant THIS SERVER resolves a tenant-less read to for this session (authorizeRead's default, from the same authz.DefaultTenant so the two cannot drift). It is not a claim about reach — it names the single customer whose data is already on screen, so the console can say so instead of presenting it as the whole book of business. Empty when the server would refuse such a read instead of resolving it."
                  - title: "engine — HandleWhoami"
                    type: object
                    properties:
                      "can_push_policy":
                        description: "Whether this deployment can change detection policy, which on a single host means \"is there a Tetragon connection to apply through\". The console gates its authoring surface on this rather than on which plane it thinks it is talking to: a fake/dev engine has no Tetragon and must not offer a button that cannot work."
                      "csrf": {}
                      "hostname": {}
                      "server_ip": {}
                      "user": {}
        "401": { description: "Unauthenticated" }
        "404": { description: "Not found, or not visible to this caller" }
