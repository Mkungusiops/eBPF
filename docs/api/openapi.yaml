  "/readyz":
    get:
      tags: ["Operations"]
      operationId: get_readyz
      summary: "handleReadyz"
      description: |
        control-plane — handleReadyz:
        handleReadyz reports whether the control plane can actually SERVE, which
        for an operator console means one thing: can it read its central store?
        /healthz answers a constant. It proves the process is running and nothing
        else — and it is what the deployment's uptime checks point at. So when
        this control plane lost its database, all five store-backed read endpoints
        returned 500 to the console while /healthz stayed green: nothing paged,
        nothing failed over, and the only signal in the entire system was an
        operator noticing that a 24h window showed fewer alerts than a 5m one. The
        probe runs the same path the read endpoints run — transaction, SET LOCAL
        ROLE, tenant GUC, indexed read — so it catches connection, role and grant
        failures rather than just TCP reachability.

        engine — handleReadyz:
        handleReadyz is readiness: can this engine actually serve an operator?
        This box had NO probe of any kind — no /healthz, no /readyz — so nothing
        outside it could distinguish "serving" from "up but useless". The control
        plane's equivalent outage on 2026-08-05 stayed invisible for hours for
        exactly this reason, and it at least had a (constant) /healthz. The probe
        reads one row through the same store the API reads, so a corrupt, locked
        or unreadable database fails it rather than being discovered by an
        operator staring at an empty dashboard. Public, and deliberately terse: it
        must be usable by a load balancer that holds no session.

        Surface: control-plane, engine.
      responses:
        "200":
          description: |
            Success. The fields below are those OBSERVED on this handler's
            response path, derived from its writeJSON literals - they are
            NOT an exhaustive schema, and the shape varies by outcome.
            Read `ok` as 'the agent confirmed it applied', not 'accepted'.
            A field published WITHOUT a type is one the source does not
            settle - it is listed because the handler emits it, and left
            untyped rather than guessed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  "detail":
                    type: string
                  "status":
                    type: string
                  "store":
                    type: string
        "401": { description: "Unauthenticated" }
        "404": { description: "Not found, or not visible to this caller" }
        "503":
          description: |
            Not ready, or the dependency this endpoint needs is unavailable
