        is deliberately IDENTICAL to the engine's /api/settings/protected so one
        console component drives both planes; two shapes for one concept is how a
        console ends up working on single-tenant and quietly broken on the control
        plane. Two things about this surface are not symmetrical, and the response
        says so rather than letting the console infer a symmetry that does not
        exist: 1. There is a floor. DefaultSystemCriticalBinaries is compiled into
        every agent and re-unioned on every apply, so a tenant can widen
        protection and cannot remove the login path — not by mistake, and not with
        a valid signature from a compromised control plane. 2. Removing a MAC does
        not un-protect a running agent. The agent's SetProtectedMACs is add-only
