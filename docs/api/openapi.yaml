  "/api/fleet/thaw":
    post:
      tags: ["Fleet operations"]
      operationId: post_api_fleet_thaw
      summary: "handleChokeThaw / handleFleetThaw"
      description: |
        control-plane — handleChokeThaw:
        handleChokeThaw — release containment. Two shapes, both real: -
        {exec_id|pid}: release THAT process. A host list narrows where it is
        released instead of letting the router guess which agents may own it. -
        {reason} only: release EVERY contained process on the targeted hosts — the
        console's "Thaw quarantine" button, which sends {reason, targets} and
        nothing else. targets and agent_id both narrow WHERE; agent_id means the
        same single host it means on the branch above, never "and also everybody
        else". The second shape used to 400 with "exec_id or pid required", so the
        fleet Thaw control was dead on the control plane while the identical
        button worked on the single-host engine (whose reason-only thaw releases
        the quarantine tier). The protobuf Thaw message carries an exec_id, so
        there is no fleet-wide release COMMAND — but the control plane already
        knows what each agent has contained, because every agent reports its choke
        snapshot on each heartbeat and this file renders it. So a fleet thaw is N
        per-process Thaws against the targeted agents, and needs no protocol
        change.

