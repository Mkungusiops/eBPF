  "/api/version":
    get:
      tags: ["Operations"]
      operationId: get_api_version
      summary: "handleVersion"
      description: |
        handleVersion returns the control-plane build (public; not sensitive).
        `sha` was the constant "0.3.0-controlplane" and had never changed, so the
        endpoint could not answer the one question it exists for: which code is
        this box running? It now reports the source revision the binary was built
        from. handleVersion reports the running build. It was completely ungated,
        which on an internet-facing multi-tenant console meant anyone could read
        the exact revision, dirty flag and build time of an enterprise security
        control plane — a free answer to "is this box behind on patches?", and it
        was live, returning dirty=true against a public hostname. The console
        needs it too (the sha drives the build-change reload toast), so it stays
        available to an authenticated session. Everyone else has to be on the box:
        see internal/edge for why a loopback peer alone is not sufficient evidence
        of that.

        Surface: control-plane, engine.
        Requires the tenant query parameter.
      parameters:
        - $ref: '#/components/parameters/tenant'
      responses:
        "200": { description: "Success" }
        "401": { description: "Unauthenticated" }
        "404": { description: "Not found, or not visible to this caller" }
