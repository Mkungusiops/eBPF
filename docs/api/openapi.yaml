  description: |
    Two independent HTTP surfaces. They are NOT interchangeable and are
    documented together only because one console can drive both.

      * control-plane — multi-tenant. Every request is tenant-scoped and
        authorisation is evaluated per tenant. This is the MSSP/MSOC
        surface.
      * engine — single-tenant. One host, its own console, no tenancy
        model. This is the standalone product.

    A third surface, the agent-to-control-plane wire contract, is gRPC and
    is specified by the protobuf IDL in engine/proto/ebpfsoc/v1 — not here.

    Denials return 404, never 403, so a caller cannot use error codes to
    discover which tenants or resources exist. Treat a 404 as
    'no such thing, or not yours' — the distinction is deliberately
    unavailable.
