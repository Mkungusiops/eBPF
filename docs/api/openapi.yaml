  "/readyz":
    get:
      tags: ["Operations"]
      operationId: get_readyz
      summary: "handleReadyz"
      description: |
        handleReadyz reports whether the control plane can actually SERVE, which
        for an operator console means one thing: can it read its central store?
        /healthz answers a constant. It proves the process is running and nothing
        else — and it is what the deployment's uptime checks point at. So when
        this control plane lost its database, all five store-backed read endpoints
        returned 500 to the console while /healthz stayed green: nothing paged,
        nothing failed over, and the only signal in the entire system was an
        operator noticing that a 24h window showed fewer alerts than a 5m one. The
        probe runs the same path the read endpoints run — transaction, SET LOCAL
        ROLE, tenant GUC, indexed read — so it catches connection, role and grant
        failures rather than just TCP reachability.

        Surface: control-plane, engine.
      responses:
        "200": { description: "Success" }
        "401": { description: "Unauthenticated" }
        "404": { description: "Not found, or not visible to this caller" }
