      operationId: get_api_verify_chain
      summary: "handleVerifyChain"
      description: |
        handleVerifyChain — decision hash-chain audit. The central store does NOT
        hash-chain decisions per tenant yet, so there is nothing here to verify.
        This used to answer {"ok":true,"total":0}, and the console renders
        anything that is not ok=false as "audit chain verified" — so pressing
        Verify on the fleet console told the operator their tamper-evidence was
        intact after checking exactly zero records. A security product may report
        that a control is unavailable; it may not report an unrun check as passed.
        supported=false is what the console keys on to say "not available here"
        rather than either "verified" or the equally wrong "chain broken".

        Surface: control-plane, engine.
        Requires the tenant query parameter.
      parameters:
