  "/api/system-health":
    get:
      tags: ["Operations"]
      operationId: get_api_system_health
      summary: "handleSystemHealth"
      description: |
        handleSystemHealth reports the tenant's control-plane-side health. Scoped
        to what the control plane can actually observe: agent heartbeats. It used
        to answer `tetragon: "connected"` and `stream: "live"` as constants —
        claims about a kernel sensor running on a host the control plane never
        inspects, asserted even when every agent in the tenant had been silent for
        hours. Kernel-sensor state belongs to the agent and reaches the console
        via the single-tenant engine's own /api/system-health; it is reported as
        unknown here rather than invented. A registered agent is only meaningful
        if it is still heartbeating, so "healthy" means at least one FRESH agent,
        not at least one row.

        Surface: control-plane, engine.
        Requires the tenant query parameter.
      parameters:
