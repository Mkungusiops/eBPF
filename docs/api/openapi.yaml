  "/api/choke/annotate":
    post:
      tags: ["Containment — process plane"]
      operationId: post_api_choke_annotate
      summary: "handleChokeAnnotate"
      description: |
        control-plane — handleChokeAnnotate:
        handleChokeAnnotate refuses, because it cannot do what it was claiming to
        do. It authorized the caller and returned {"ok": true} WITHOUT EVER
        READING THE BODY. The console took that as success and toasted "note
        saved"; the operator wrote a justification onto a containment — the kind
        of thing that exists to be read back during an incident review — and it
        went nowhere. On refresh the field was empty again, because no
        control-plane endpoint emits an annotation at all. This is the same defect
        family as the tool contract that advertised eleven filter parameters no
        server read. 501 with the reason is the honest interim: the console can
        disable the control instead of offering one that discards what is typed
        into it. The full fix is a hash-chained store.Decision with Action
        "annotate" and the note as Reason, mirroring the audit write in
        internal/api/policypush.go — Reason and Actor are both chained, so an
        annotation becomes tamper-evident evidence rather than decoration. It
        needs a length cap (the handler accepts an unbounded string) and a look at
        /api/choke/forensic-snapshot, which reads a fixed RecentDecisions(2000)
        budget that annotations would start consuming. NOTE: this keeps
        authorizeRespond. Routing it to handleChokeWriteStub, which is the obvious
        tidy-up, would silently downgrade this to authorizeRead.

        engine — handleChokeAnnotate:
        POST /api/choke/annotate — operator note attached to a circuit. Empty
        `note` clears the annotation.

        Surface: control-plane, engine.
        Requires the tenant query parameter on the control plane; the
        engine surface has no tenancy model and ignores it.
      parameters:
