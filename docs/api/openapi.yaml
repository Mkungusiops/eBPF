        handleFleetThaw releases a choke across the targeted peers. Body: a JSON
        object — the peer's own payload, plus an optional "targets" list naming
        the hosts the write may reach. Absent or null "targets" means every peer
        in the hosts file (the estate-wide write); a named list means exactly
        those peers and no others. An empty list, a name that is not in the hosts
