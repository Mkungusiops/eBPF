<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Self-adapting via prefers-color-scheme so the tab icon is correct BEFORE
       any JS runs, and on pages that never run the app (login, Keycloak, error
       pages). applyTheme() still swaps to favicon-light.svg when the operator
       picks a theme explicitly; both paths land on the same light treatment, so
       they cannot disagree. -->
  <style>
    .tile { fill: #0a0f1c; }
    .wash { fill: rgba(34, 211, 238, 0.12); }
    .ink  { stroke: #22d3ee; }
    .dot  { fill: #22d3ee; }
    @media (prefers-color-scheme: light) {
      /* A near-black tile on a light tab strip reads as a heavy blob; go to a
         white tile with a hairline edge and deepen the cyan, because #22d3ee on
         white is about 1.9:1 and illegible at 16px. */
      .tile { fill: #ffffff; stroke: #cbd5e1; stroke-width: 0.6; }
      .wash { fill: rgba(8, 145, 178, 0.10); }
      .ink  { stroke: #0891b2; }
      .dot  { fill: #0891b2; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="6"/>
  <path class="wash ink" d="M16 4 L27 10 V22 L16 28 L5 22 V10 Z"
        stroke-width="1.6" stroke-linejoin="round"/>
  <path class="ink" d="M16 9 L22 12.5 V19.5 L16 23 L10 19.5 V12.5 Z"
        fill="none" stroke-width="1.4" stroke-linejoin="round"/>
  <circle class="dot" cx="16" cy="16" r="2.4"/>
</svg>
