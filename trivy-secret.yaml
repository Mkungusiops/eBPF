# Trivy secret-scanner configuration.
#
# Same reasoning as .gitleaks.toml, for the second scanner: this product PLANTS
# decoy credentials. The honeypot subsystem writes a fake AWS key, a fake
# `_id_rsa` and a fake `_shadow` into a watched directory so that anything
# reading them raises an alert. Bait that does not look like a real credential
# does not work as bait — which means every secret scanner will find it.
#
# Both scanners are kept and both are allow-listed by PATH, deliberately: two
# independent tools looking at the same tree catch different things, and
# silencing either one wholesale would be the easy, wrong answer.
#
# Every entry here was verified by hand against the file it names. If a finding
# appears OUTSIDE these paths, treat it as real.
#
# Used by scripts/scan.sh via --secret-config.

# Trivy's built-in rules stay enabled; these paths are excluded from them.
allow-rules:
  - id: honeypot-materialised-bait
    description: >-
      Decoy files written by the honeypot subsystem. Reading them IS the
      detection; they contain no access to anything.
    path: ^\.dev/honey/

  - id: honeypot-decoy-definitions
    description: >-
      The decoy strings themselves, as source. The key body reads
      "ThisIsNotARealKey" and the AWS id is twenty zeroes.
    path: ^engine/internal/api/honeypots\.go$

  - id: attack-simulation-catalogue
    description: >-
      Descriptions of attacker technique ("reads of shadow, sudoers,
      ~/.ssh/*"), not credentials.
    path: ^engine/internal/api/attacks\.go$

  - id: netns-dev-lab
    description: >-
      Local network-namespace lab. The only credential is a shell variable with
      a development default (NETNS_PASS), inside a usage comment.
    path: ^scripts/dev/netns-.*\.sh$

  - id: smoke-invalid-token
    description: >-
      smoke.sh asserts that an INVALID bearer token is rejected with 401. The
      token is the literal word "bogus"; a valid one would defeat the test.
    path: ^scripts/smoke\.sh$
