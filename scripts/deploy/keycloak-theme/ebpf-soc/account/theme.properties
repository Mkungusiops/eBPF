# eBPF-SOC ACCOUNT theme — rebrands Keycloak's Account Console.
#
# The third and last themeable surface. The login theme covers sign-in and the
# admin theme covers the admin console, but the Account Console (the page a user
# reaches via "Applications" / account management) is its own theme type and was
# still showing stock Keycloak branding.
#
# keycloak.v3's index.ftl reads the same properties as the admin theme, so this
# stays a properties-only reskin — no template overrides, upgrade-safe.
parent=keycloak.v3
import=common/keycloak

logo=/img/brand-wordmark.svg
logoUrl=/

favIcon=/img/favicon.svg
favIconType=image/svg+xml

title=eBPF SOC — Account
