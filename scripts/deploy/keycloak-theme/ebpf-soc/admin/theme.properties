# eBPF-SOC ADMIN theme — rebrands the logged-in Keycloak admin console.
#
# The login theme only covers the sign-in page; once you are inside, the admin
# console is a separate React app with its own theme type. keycloak.v2's
# index.ftl reads these properties, so swapping the masthead logo, the browser
# tab favicon and the tab title needs no template override at all — still a
# properties/CSS-only reskin, so it survives Keycloak upgrades.
parent=keycloak.v2
import=common/keycloak

# Masthead logo (paths are resolved against the theme's resourceUrl) and where
# clicking it lands. logoUrl points at the SOC console, not keycloak.org.
logo=/img/brand-wordmark.svg
logoUrl=/

# Browser tab: the same hexagon mark the login pages and the console use.
favIcon=/img/favicon.svg
favIconType=image/svg+xml

title=eBPF SOC — Platform Admin
