<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 40" width="188" height="40" role="img" aria-label="eBPF SOC">
  <!-- Horizontal lockup for the admin-console masthead: the same cyan hexagon
       shield as the favicon and login brand, plus the wordmark in the console's
       text tone so it sits correctly on the dark header.
       NOTE: no double hyphens in this comment; they are illegal in XML and
       silently break the whole SVG (it then fails to render in an img tag). -->
  <g transform="translate(4 4)">
    <path d="M16 3 L28 9.5 V22.5 L16 29 L4 22.5 V9.5 Z"
          fill="rgba(34,211,238,0.10)"
          stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M16 9 L22 12.5 V19.5 L16 23 L10 19.5 V12.5 Z"
          fill="none"
          stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="16" cy="16" r="2.4" fill="#22d3ee"/>
  </g>
  <text x="44" y="26"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="600" letter-spacing="2.6" fill="#e6eaf1">eBPF SOC</text>
</svg>
