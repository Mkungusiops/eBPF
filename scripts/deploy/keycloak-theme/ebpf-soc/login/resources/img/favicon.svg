<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- NO tile. The Keycloak login pages never run the console's JS, so they
       cannot swap icons by theme, and a .ico cannot carry a media query — this
       one artwork has to be legible on a near-black tab strip AND a white one.
       A solid dark tile fails the second; a solid light tile fails the first.
       A tile-less mark in mid-cyan clears ~3:1 against both. -->
  <path d="M16 4 L27 10 V22 L16 28 L5 22 V10 Z"
        fill="none" stroke="#0aa5c4" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 10 L21.5 13.2 V19.8 L16 23 L10.5 19.8 V13.2 Z"
        fill="none" stroke="#0aa5c4" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="2.6" fill="#0aa5c4"/>
</svg>
