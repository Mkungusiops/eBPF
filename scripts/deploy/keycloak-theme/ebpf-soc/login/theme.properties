# eBPF-SOC Keycloak login theme — a CSS-only reskin.
#
# It inherits the stock `keycloak` login theme wholesale (same PatternFly
# markup, same templates, same message bundles) and only appends one extra
# stylesheet plus a favicon. Nothing here overrides a FreeMarker template, so
# it carries forward across Keycloak upgrades with near-zero maintenance — the
# reason we chose the CSS-only path over a bespoke theme.
#
# Applied to BOTH the master realm (the admin-console login) and the ebpf-soc
# realm (the operator login) so the whole platform looks like one product.
parent=keycloak
import=common/keycloak

# Inherit the base stylesheet (css/login.css resolves from the parent theme),
# then load ours last so it wins. stylesCommon (PatternFly) is inherited.
styles=css/login.css css/ebpf-soc.css

# The stock template hardcodes a .ico favicon, which cannot follow the OS theme
# and sits at a URL Keycloak versions by server build — so replacing the file
# never reaches a browser that has already cached the icon. This swaps the link
# to a themed SVG at a versioned URL. See resources/js/favicon.js.
scripts=js/favicon.js
