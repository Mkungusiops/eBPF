# eBPF-SOC login theme — PLATFORM ADMIN variant (master realm).
#
# Identical to the ebpf-soc theme in every respect except the context pill: it
# inherits the parent's stylesheet and only appends context.css, which flips a
# handful of CSS variables. No CSS is duplicated, so any future change to the
# base theme is picked up here automatically.
#
# css/login.css     resolves from the stock keycloak theme (grandparent)
# css/ebpf-soc.css  resolves from the ebpf-soc theme (parent)
# css/context.css   is the only file this theme actually owns
parent=ebpf-soc
import=common/keycloak

styles=css/login.css css/ebpf-soc.css css/context.css
